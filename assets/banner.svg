<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Salam, Bonjour, Hello, 你好. I'm Tarik Anni: software developer, networks and cloud (AWS), aspiring AI engineer. A spinning globe shows a flight from Agadir, Morocco to Chengdu, China.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset=".68" stop-color="#0E1630"/>
      <stop offset="1" stop-color="#1A1240"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F5F7FB"/>
      <stop offset=".45" stop-color="#F5F7FB"/>
      <stop offset=".5" stop-color="#7DE3FF"/>
      <stop offset=".55" stop-color="#F5F7FB"/>
      <stop offset="1" stop-color="#F5F7FB"/>
      <animate attributeName="x1" values="-1;1;1" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;2" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#B388FF"/>
    </linearGradient>
    <radialGradient id="globeFill" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#1D3A6E"/>
      <stop offset=".6" stop-color="#0E1C3A"/>
      <stop offset="1" stop-color="#070B16"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".6" stop-color="#4CC9F0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunset" cx=".5" cy="1" r=".6">
      <stop offset="0" stop-color="#B388FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#B388FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="floorMask"><rect y="318" width="1280" height="122" fill="url(#floorFade)" transform="rotate(180 640 379)"/></mask>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
    <clipPath id="globeClip"><circle cx="980" cy="178" r="120"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Noto Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; }
      .hi { font-size: 28px; font-weight: 600; fill: #7DE3FF; opacity: 0; animation: hello 12s infinite; }
      .hi.b { animation-delay: 3s; } .hi.c { animation-delay: 6s; } .hi.d { animation-delay: 9s; }
      @keyframes hello { 0% { opacity: 0; transform: translateY(12px); } 4%, 21% { opacity: 1; transform: translateY(0); } 25%, 100% { opacity: 0; transform: translateY(-12px); } }
      .name { font-size: 84px; font-weight: 800; letter-spacing: -3px; }
      .role { font-size: 21px; font-weight: 500; fill: #A9B4C8; }
      .role b { fill: #7DE3FF; font-weight: 700; }
      .place { font-size: 15px; font-weight: 600; fill: #E7ECF5; }
      .star { fill: #FFFFFF; animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
      .hline { stroke: #B388FF; stroke-opacity: .55; animation: run 2.4s linear infinite; }
      @keyframes run { from { transform: translateY(0); } to { transform: translateY(30px); } }
      .ring { fill: none; stroke: #4CC9F0; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
      .ring.late { animation-delay: 1.2s; }
      @keyframes ping { from { transform: scale(.4); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
      .route { stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .orbit { transform-origin: 980px 178px; animation: orbit 18s linear infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      .chip { animation: float 6s ease-in-out infinite; }
      .chip.b { animation-delay: -2s; } .chip.c { animation-delay: -4s; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .caret { fill: #7DE3FF; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#sky)"/>
    <ellipse cx="980" cy="318" rx="520" ry="160" fill="url(#sunset)"/>

    <!-- stars -->
    <g>
      <circle class="star" cx="64" cy="40" r="1.2"/>
      <circle class="star" cx="210" cy="26" r="1" style="animation-delay:-1s"/>
      <circle class="star" cx="388" cy="56" r="1.4" style="animation-delay:-2s"/>
      <circle class="star" cx="560" cy="30" r="1" style="animation-delay:-.5s"/>
      <circle class="star" cx="640" cy="92" r="1.2" style="animation-delay:-1.6s"/>
      <circle class="star" cx="732" cy="44" r="1.6" style="animation-delay:-2.4s"/>
      <circle class="star" cx="820" cy="22" r="1" style="animation-delay:-.8s"/>
      <circle class="star" cx="1150" cy="40" r="1.3" style="animation-delay:-1.2s"/>
      <circle class="star" cx="1230" cy="98" r="1" style="animation-delay:-2.7s"/>
      <circle class="star" cx="1196" cy="250" r="1.2" style="animation-delay:-.3s"/>
      <circle class="star" cx="700" cy="200" r="1" style="animation-delay:-1.9s"/>
      <circle class="star" cx="470" cy="140" r="1" style="animation-delay:-2.2s"/>
    </g>

    <!-- synthwave floor, moving toward you -->
    <g mask="url(#floorMask)">
      <g stroke="#B388FF" stroke-opacity=".4" stroke-width="1">
        <path d="M640 318 L-560 440 M640 318 L-260 440 M640 318 L40 440 M640 318 L340 440 M640 318 L640 440 M640 318 L940 440 M640 318 L1240 440 M640 318 L1540 440 M640 318 L1840 440"/>
      </g>
      <g>
        <line class="hline" x1="0" y1="320" x2="1280" y2="320"/>
        <line class="hline" x1="0" y1="330" x2="1280" y2="330" style="animation-delay:-.6s"/>
        <line class="hline" x1="0" y1="345" x2="1280" y2="345" style="animation-delay:-1.2s"/>
        <line class="hline" x1="0" y1="368" x2="1280" y2="368" style="animation-delay:-1.8s"/>
        <line class="hline" x1="0" y1="400" x2="1280" y2="400"/>
        <line class="hline" x1="0" y1="430" x2="1280" y2="430" style="animation-delay:-1.2s"/>
      </g>
    </g>
    <line x1="0" y1="318" x2="1280" y2="318" stroke="url(#accent)" stroke-opacity=".7"/>

    <!-- globe -->
    <circle cx="980" cy="178" r="168" fill="url(#halo)"/>
    <circle cx="980" cy="178" r="120" fill="url(#globeFill)"/>
    <g clip-path="url(#globeClip)" fill="none" stroke="#4CC9F0" stroke-opacity=".28" stroke-width="1">
      <!-- latitudes -->
      <ellipse cx="980" cy="178" rx="120" ry="14"/>
      <ellipse cx="980" cy="138" rx="113" ry="13"/>
      <ellipse cx="980" cy="218" rx="113" ry="13"/>
      <ellipse cx="980" cy="98" rx="90" ry="10"/>
      <ellipse cx="980" cy="258" rx="90" ry="10"/>
      <ellipse cx="980" cy="66" rx="48" ry="6"/>
      <ellipse cx="980" cy="290" rx="48" ry="6"/>
      <!-- meridians: rx follows |cos| to fake rotation -->
      <ellipse cx="980" cy="178" rx="120" ry="120"><animate attributeName="rx" values="120;104;60;0;60;104;120" dur="12s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="980" cy="178" rx="60" ry="120"><animate attributeName="rx" values="60;0;60;104;120;104;60" dur="12s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="980" cy="178" rx="104" ry="120"><animate attributeName="rx" values="104;60;0;60;104;120;104" dur="12s" repeatCount="indefinite"/></ellipse>
      <line x1="980" y1="58" x2="980" y2="298" stroke-opacity=".18"/>
    </g>
    <circle cx="980" cy="178" r="120" fill="none" stroke="#7DE3FF" stroke-opacity=".5"/>

    <!-- orbit ring with satellite -->
    <ellipse cx="980" cy="178" rx="190" ry="44" fill="none" stroke="#FFFFFF" stroke-opacity=".08" transform="rotate(-14 980 178)"/>
    <g transform="rotate(-14 980 178)">
      <circle r="4" fill="#FFB703">
        <animateMotion dur="9s" repeatCount="indefinite" path="M1170 178 A190 44 0 1 1 790 178 A190 44 0 1 1 1170 178"/>
      </circle>
    </g>

    <!-- Agadir → Chengdu route -->
    <path id="route" d="M893 132 Q980 10 1067 132" fill="none" stroke="url(#accent)" stroke-width="2.5" class="route"/>
    <circle cx="893" cy="132" r="5" fill="#E63946"/>
    <circle class="ring" cx="893" cy="132" r="6" stroke="#E63946"/>
    <circle cx="1067" cy="132" r="5" fill="#FFB703"/>
    <circle class="ring late" cx="1067" cy="132" r="6" stroke="#FFB703"/>
    <g>
      <path d="M-9 -3 L8 0 L-9 3 L-6 0 Z M-2 -8 L2 0 L-2 8 L-4 0 Z" fill="#FFFFFF"/>
      <animateMotion dur="5s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear">
        <mpath href="#route"/>
      </animateMotion>
    </g>
    <g class="sans" font-size="13" font-weight="700">
      <text x="866" y="160" fill="#FF8A93">Agadir</text>
      <text x="1040" y="160" fill="#FFD166">Chengdu</text>
    </g>

    <!-- floating chips -->
    <g class="mono" font-size="13">
      <g transform="translate(1136 64)"><g class="chip"><rect width="104" height="30" rx="15" fill="#0A0F1A" fill-opacity=".85" stroke="#7DE3FF" stroke-opacity=".4"/><text x="52" y="20" text-anchor="middle" fill="#7DE3FF">aws deploy</text></g></g>
      <g transform="translate(760 250)"><g class="chip b"><rect width="104" height="30" rx="15" fill="#0A0F1A" fill-opacity=".85" stroke="#B388FF" stroke-opacity=".5"/><text x="52" y="20" text-anchor="middle" fill="#CDB6FF">model.fit()</text></g></g>
      <g transform="translate(1118 262)"><g class="chip c"><rect width="122" height="30" rx="15" fill="#0A0F1A" fill-opacity=".85" stroke="#8FE3B0" stroke-opacity=".45"/><text x="61" y="20" text-anchor="middle" fill="#8FE3B0">npx expo start</text></g></g>
    </g>

    <!-- left: who -->
    <g class="sans" transform="translate(72 96)">
      <text class="hi a">Salam, I'm</text>
      <text class="hi b">Bonjour, je suis</text>
      <text class="hi c">Hello, I'm</text>
      <text class="hi d">你好，我是</text>
    </g>
    <text class="sans name" x="66" y="184" fill="url(#nameFill)">Tarik Anni</text>
    <rect x="72" y="206" width="110" height="5" rx="2.5" fill="url(#accent)"/>
    <text class="sans role" x="72" y="250">I build <tspan fill="#F5F7FB" font-weight="700">apps</tspan>, ship them to the <tspan fill="#F5F7FB" font-weight="700">cloud</tspan>,</text>
    <text class="sans role" x="72" y="280">and I'm heading into <tspan fill="#7DE3FF" font-weight="700">artificial intelligence</tspan><tspan class="caret"> ▋</tspan></text>

    <g class="sans" transform="translate(72 352)">
      <rect width="166" height="36" rx="18" fill="#0A0F1A" fill-opacity=".7" stroke="#FFFFFF" stroke-opacity=".14"/>
      <circle cx="20" cy="18" r="5" fill="#E63946"/>
      <text class="place" x="34" y="23">Agadir, Morocco</text>
      <rect x="178" width="160" height="36" rx="18" fill="#0A0F1A" fill-opacity=".7" stroke="#FFFFFF" stroke-opacity=".14"/>
      <circle cx="198" cy="18" r="5" fill="#FFB703"/>
      <text class="place" x="212" y="23">Chengdu, China</text>
      <rect x="350" width="132" height="36" rx="18" fill="#0A0F1A" fill-opacity=".7" stroke="#FFFFFF" stroke-opacity=".14"/>
      <circle cx="370" cy="18" r="5" fill="#8FE3B0"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text class="place" x="384" y="23">Open to work</text>
    </g>
  </g>
</svg>

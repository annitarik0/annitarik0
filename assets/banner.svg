<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Salam, Bonjour, Hello, 你好. I'm Tarik Anni: software developer, networks and cloud (AWS), aspiring AI engineer. Agadir, Morocco and Chengdu, China.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#7B8CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Noto Sans", "Noto Sans Arabic", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; }
      .hi { font-size: 30px; font-weight: 600; fill: #4CC9F0; opacity: 0; animation: hello 12s infinite; }
      .hi.b { animation-delay: 3s; } .hi.c { animation-delay: 6s; } .hi.d { animation-delay: 9s; }
      @keyframes hello { 0% { opacity: 0; transform: translateY(10px); } 4%, 21% { opacity: 1; transform: translateY(0); } 25%, 100% { opacity: 0; transform: translateY(-10px); } }
      .name { font-size: 76px; font-weight: 800; fill: #F5F7FB; letter-spacing: -2.5px; }
      .role { font-size: 22px; font-weight: 500; fill: #A9B4C8; }
      .dot { fill: #4CC9F0; }
      .place { font-size: 17px; font-weight: 600; fill: #E7ECF5; }
      .term-line { font-size: 17px; opacity: 0; animation: type 12s infinite; }
      .l2 { animation-delay: .9s; } .l3 { animation-delay: 1.8s; } .l4 { animation-delay: 2.7s; } .l5 { animation-delay: 3.6s; } .l6 { animation-delay: 4.5s; }
      @keyframes type { 0% { opacity: 0; } 2%, 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
      .prompt { fill: #7B8CFF; } .cmd { fill: #E7ECF5; } .out { fill: #8FE3B0; }
      .cursor { fill: #4CC9F0; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .bar { fill: url(#accent); transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.6s ease-in-out infinite; }
      @keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) {
        .hi, .term-line, .cursor, .bar { animation: none; }
        .hi.a, .term-line { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <!-- greeting in the four languages I speak -->
    <g class="sans" transform="translate(72 104)">
      <text class="hi a">Salam, I'm</text>
      <text class="hi b">Bonjour, je suis</text>
      <text class="hi c">Hello, I'm</text>
      <text class="hi d">你好，我是</text>
    </g>
    <text class="sans name" x="68" y="190">Tarik Anni</text>
    <rect x="72" y="214" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text class="sans role" x="72" y="262">Software developer <tspan class="dot">·</tspan> Networks &amp; Cloud (AWS) <tspan class="dot">·</tspan> Aspiring AI engineer</text>

    <!-- places -->
    <g class="sans" transform="translate(72 318)">
      <rect width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".1"/>
      <circle cx="22" cy="20" r="5" fill="#E63946"/>
      <text class="place" x="38" y="26">Agadir, Morocco</text>
      <rect x="208" width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".1"/>
      <circle cx="230" cy="20" r="5" fill="#FFB703"/>
      <text class="place" x="246" y="26">Chengdu, China</text>
    </g>

    <!-- terminal card -->
    <g transform="translate(812 70)">
      <rect width="400" height="262" rx="18" fill="#0A0F1A" fill-opacity=".85" stroke="#FFFFFF" stroke-opacity=".1"/>
      <circle cx="26" cy="24" r="6" fill="#FF5F57"/><circle cx="46" cy="24" r="6" fill="#FEBC2E"/><circle cx="66" cy="24" r="6" fill="#28C840"/>
      <text class="mono" x="200" y="29" text-anchor="middle" font-size="13" fill="#5B667A">~/tarik</text>
      <g class="mono" transform="translate(24 76)">
        <text class="term-line l1" y="0"><tspan class="prompt">❯ </tspan><tspan class="cmd">whoami</tspan></text>
        <text class="term-line l2" y="28"><tspan class="out">developer · designer · learner</tspan></text>
        <text class="term-line l3" y="62"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat building.txt</tspan></text>
        <text class="term-line l4" y="90"><tspan class="out">iOS · Flutter · Laravel · AWS</tspan></text>
        <text class="term-line l5" y="124"><tspan class="prompt">❯ </tspan><tspan class="cmd">next --goal</tspan></text>
        <text class="term-line l6" y="152"><tspan class="out">a Master's in AI</tspan><tspan class="cursor"> ▋</tspan></text>
      </g>
    </g>

    <!-- equaliser strip -->
    <g transform="translate(812 352)">
      <rect class="bar" x="0" y="-24" width="8" height="24" rx="3" style="animation-delay:-.2s"/>
      <rect class="bar" x="14" y="-24" width="8" height="24" rx="3" style="animation-delay:-.9s"/>
      <rect class="bar" x="28" y="-24" width="8" height="24" rx="3" style="animation-delay:-.4s"/>
      <rect class="bar" x="42" y="-24" width="8" height="24" rx="3" style="animation-delay:-1.3s"/>
      <rect class="bar" x="56" y="-24" width="8" height="24" rx="3" style="animation-delay:-.6s"/>
      <rect class="bar" x="70" y="-24" width="8" height="24" rx="3" style="animation-delay:-1.1s"/>
      <rect class="bar" x="84" y="-24" width="8" height="24" rx="3" style="animation-delay:-.1s"/>
      <text class="mono" x="108" y="-6" font-size="14" fill="#5B667A">always shipping something</text>
    </g>
  </g>
</svg>

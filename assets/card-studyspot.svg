<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="StudySpot: an iPhone app that finds the quietest places to study in Paris, with live free seats and live noise in decibels. Built with Expo, React Native and TypeScript.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F2A22"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1F8A5B"/><stop offset="1" stop-color="#8FE3B0"/></linearGradient>
    <clipPath id="c"><rect width="600" height="320" rx="22"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
      .b { fill: url(#bar); transform-box: fill-box; transform-origin: 50% 100%; animation: eq 2.2s ease-in-out infinite; }
      @keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
      .quiet { animation: hush 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes hush { 0%, 30% { transform: scaleY(1); } 50%, 80% { transform: scaleY(.18); } 100% { transform: scaleY(1); } }
      .db { animation: db 6s steps(1) infinite; }
      .db.q { opacity: 0; animation-name: dbq; }
      @keyframes db { 0%, 45% { opacity: 1; } 46%, 84% { opacity: 0; } 85%, 100% { opacity: 1; } }
      @keyframes dbq { 0%, 45% { opacity: 0; } 46%, 84% { opacity: 1; } 85%, 100% { opacity: 0; } }
      .pin { animation: bob 2.4s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="600" height="320" fill="url(#bg)"/>
    <rect x=".5" y=".5" width="599" height="319" rx="22" fill="none" stroke="#8FE3B0" stroke-opacity=".25"/>

    <text class="mono" x="32" y="44" font-size="13" fill="#8FE3B0" letter-spacing="2">01 · IOS APP</text>
    <text class="sans" x="32" y="92" font-size="40" font-weight="800" fill="#F5F7FB" letter-spacing="-1">StudySpot</text>
    <text class="sans" x="32" y="126" font-size="17" fill="#A9B4C8">Finds the quietest place to study</text>
    <text class="sans" x="32" y="148" font-size="17" fill="#A9B4C8">in Paris. Live seats, live decibels.</text>
    <g class="mono" font-size="12" transform="translate(32 268)">
      <rect width="62" height="26" rx="13" fill="#FFFFFF" fill-opacity=".07"/><text x="31" y="17" text-anchor="middle" fill="#E7ECF5">Expo</text>
      <rect x="70" width="112" height="26" rx="13" fill="#FFFFFF" fill-opacity=".07"/><text x="126" y="17" text-anchor="middle" fill="#E7ECF5">React Native</text>
      <rect x="190" width="96" height="26" rx="13" fill="#FFFFFF" fill-opacity=".07"/><text x="238" y="17" text-anchor="middle" fill="#E7ECF5">Reanimated</text>
    </g>

    <!-- city as an equaliser that goes quiet where the pin lands -->
    <g transform="translate(350 236)">
      <rect class="b" x="0"   y="-90"  width="14" height="90"  rx="4" style="animation-delay:-.3s"/>
      <rect class="b" x="20"  y="-120" width="14" height="120" rx="4" style="animation-delay:-1.1s"/>
      <rect class="b" x="40"  y="-70"  width="14" height="70"  rx="4" style="animation-delay:-.7s"/>
      <rect class="b quiet" x="60"  y="-130" width="14" height="130" rx="4" style="fill:#8FE3B0"/>
      <rect class="b quiet" x="80"  y="-110" width="14" height="110" rx="4" style="fill:#8FE3B0"/>
      <rect class="b quiet" x="100" y="-124" width="14" height="124" rx="4" style="fill:#8FE3B0"/>
      <rect class="b" x="120" y="-100" width="14" height="100" rx="4" style="animation-delay:-1.4s"/>
      <rect class="b" x="140" y="-80"  width="14" height="80"  rx="4" style="animation-delay:-.2s"/>
      <rect class="b" x="160" y="-116" width="14" height="116" rx="4" style="animation-delay:-.9s"/>
      <rect class="b" x="180" y="-64"  width="14" height="64"  rx="4" style="animation-delay:-1.7s"/>
      <rect class="b" x="200" y="-96"  width="14" height="96"  rx="4" style="animation-delay:-.5s"/>
      <line x1="-6" y1="1" x2="220" y2="1" stroke="#FFFFFF" stroke-opacity=".15"/>
      <g class="pin" transform="translate(87 -176)">
        <path d="M0 0 C-14 0 -20 10 -20 18 C-20 30 0 46 0 46 C0 46 20 30 20 18 C20 10 14 0 0 0 Z" fill="#8FE3B0"/>
        <circle cx="0" cy="18" r="7" fill="#0B1220"/>
      </g>
    </g>
    <g class="sans" font-weight="800" font-size="22" text-anchor="end">
      <text class="db" x="570" y="282" fill="#FF8A93">68 dB</text>
      <text class="db q" x="570" y="282" fill="#8FE3B0">32 dB · calme</text>
    </g>
  </g>
</svg>

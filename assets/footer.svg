<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150" role="img" aria-label="Made in Agadir, polished in Chengdu. Thanks for scrolling.">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E63946"/><stop offset=".5" stop-color="#4CC9F0"/><stop offset="1" stop-color="#B388FF"/></linearGradient>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Noto Sans Arabic", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .a { animation: wave 7s linear infinite; } .b { animation: wave 11s linear infinite reverse; }
      @keyframes wave { to { transform: translateX(-320px); } }
      .bye { opacity: 0; animation: bye 12s infinite; }
      .bye.b2 { animation-delay: 3s; } .bye.b3 { animation-delay: 6s; } .bye.b4 { animation-delay: 9s; }
      @keyframes bye { 0% { opacity: 0; } 4%, 21% { opacity: 1; } 25%, 100% { opacity: 0; } }
    </style>
  </defs>
  <path class="b" d="M0 96 q80 -26 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 V150 H0 Z" fill="url(#w)" fill-opacity=".18"/>
  <path class="a" d="M0 112 q80 -20 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 V150 H0 Z" fill="url(#w)" fill-opacity=".35"/>
  <g class="sans" text-anchor="middle" font-size="22" font-weight="700" fill="#8E9AB2">
    <text class="bye b1" x="640" y="52">Shukran for scrolling</text>
    <text class="bye b2" x="640" y="52">Merci d'être passé</text>
    <text class="bye b3" x="640" y="52">Thanks for stopping by</text>
    <text class="bye b4" x="640" y="52">谢谢光临</text>
  </g>
</svg>

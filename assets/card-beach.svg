<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Beach Time: a Flutter app that tells you if today is a perfect beach day, with a beach score, tides, UV and an AI beach buddy.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset=".55" stop-color="#2A1B3D"/><stop offset="1" stop-color="#5B2A3A"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE29A"/><stop offset=".7" stop-color="#FFB703"/><stop offset="1" stop-color="#FB8500"/></radialGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFB703" stop-opacity=".5"/><stop offset="1" stop-color="#FFB703" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="600" height="320" rx="22"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
      .w1 { animation: wave 6s linear infinite; } .w2 { animation: wave 9s linear infinite reverse; } .w3 { animation: wave 4.5s linear infinite; }
      @keyframes wave { to { transform: translateX(-200px); } }
      .sun { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      .gull { animation: fly 10s linear infinite; }
      @keyframes fly { from { transform: translate(260px, 70px); } to { transform: translate(640px, 40px); } }
      .score { animation: count 8s ease-out infinite; }
      @media (prefers-reduced-motion: reduce) { .w1, .w2, .w3, .sun, .gull { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="600" height="320" fill="url(#bg)"/>
    <circle cx="460" cy="170" r="120" fill="url(#sunGlow)"/>
    <circle class="sun" cx="460" cy="170" r="54" fill="url(#sun)"/>
    <g class="gull" stroke="#F5F7FB" stroke-width="2" fill="none" stroke-linecap="round"><path d="M0 0 q6 -6 12 0 q6 -6 12 0"/></g>

    <!-- waves -->
    <g transform="translate(0 196)">
      <path class="w2" d="M0 20 q50 -16 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V140 H0 Z" fill="#3A86FF" fill-opacity=".35"/>
      <path class="w1" d="M0 34 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V140 H0 Z" fill="#1B4F9C" fill-opacity=".8"/>
      <path class="w3" d="M0 52 q50 -10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V140 H0 Z" fill="#0B1F45"/>
    </g>

    <rect x=".5" y=".5" width="599" height="319" rx="22" fill="none" stroke="#FFB703" stroke-opacity=".3"/>
    <text class="mono" x="32" y="44" font-size="13" fill="#FFD166" letter-spacing="2">02 · FLUTTER APP</text>
    <text class="sans" x="32" y="92" font-size="40" font-weight="800" fill="#F5F7FB" letter-spacing="-1">Beach Time</text>
    <text class="sans" x="32" y="126" font-size="17" fill="#D9CFE6">Is today a perfect beach day?</text>
    <text class="sans" x="32" y="148" font-size="17" fill="#D9CFE6">Tides, UV and an AI beach buddy.</text>

    <g transform="translate(32 172)">
      <rect width="168" height="46" rx="14" fill="#0B1220" fill-opacity=".6" stroke="#FFFFFF" stroke-opacity=".15"/>
      <text class="mono" x="14" y="29" font-size="13" fill="#D9CFE6">beach score</text>
      <text class="sans" x="154" y="31" font-size="22" font-weight="800" fill="#FFD166" text-anchor="end">9.2</text>
    </g>
    <g class="mono" font-size="12" transform="translate(32 274)">
      <rect width="72" height="26" rx="13" fill="#0B1220" fill-opacity=".55"/><text x="36" y="17" text-anchor="middle" fill="#E7ECF5">Flutter</text>
      <rect x="80" width="56" height="26" rx="13" fill="#0B1220" fill-opacity=".55"/><text x="108" y="17" text-anchor="middle" fill="#E7ECF5">Dart</text>
      <rect x="144" width="58" height="26" rx="13" fill="#0B1220" fill-opacity=".55"/><text x="173" y="17" text-anchor="middle" fill="#E7ECF5">LLMs</text>
    </g>
  </g>
</svg>
